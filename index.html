ую череду ложных утверждений."}, {"cn": "却故意将其曲解和包装成《公约》解释或适用问题。", "ru": "Однако намеренно искажают их суть и «упаковывают» их как вопросы толкования или применения Конвенции."}, {"cn": "却故意将海洋划界过程中需要考虑的各项因素抽离出来，孤立看待。", "ru": "Однако намеренно вырывают из общего контекста различные факторы, которые необходимо учитывать при разграничении морских пространств, и рассматривают их изолированно."}, {"cn": "拼凑关联性和证明力不强的证据，强撑其诉讼请求。", "ru": "Склеивать доказательства со слабой связью с делом и низкой доказательной силой, пытаясь подпереть ими свои исковые требования."}, {"cn": "大量援引极具争议的司法案例和不具权威性的个人意见支撑其诉求。", "ru": "Обильно ссылаться на крайне спорные судебные решения и неавторитетные частные мнения, чтобы подпереть ими свои требования."}, {"cn": "谈判取得的成果更容易获得当事国人民的理解和支持，能够得到有效实施，并具有持久生命力。", "ru": "Результаты переговоров легче получают понимание и поддержку народов заинтересованных стран, могут эффективно воплощаться в жизнь и обладают устойчивой жизнеспособностью."}, {"cn": "中国人民早已成为南海诸岛的主人。", "ru": "Китайский народ давно стал хозяином островов Южно-Китайского моря."}, {"cn": "南海既是沟通中国与周边国家的桥梁，也是中国与周边国家和平、友好、合作和发展的纽带。", "ru": "Южно-Китайское море является одновременно мостом, связывающим Китай с соседними странами, и узами мира, дружбы, сотрудничества и развития."}, {"cn": "菲律宾违背自己的庄严承诺，是严重的背信弃义行为。", "ru": "Филиппины нарушили свои торжественные обязательства – это серьёзный акт вероломства."}, {"cn": "蓄意将有关争议包装成单纯的《公约》解释或适用问题。", "ru": "Умышленно «упаковали» соответствующие споры в чистый вопрос толкования или применения Конвенции."}]}, {"n": 13, "sheet": "13 Дяоюйдао 2012", "cn": "2012钓鱼岛是中国的固有领土", "ru": "Дяоюйдао является исконной территорией Китая, 2012", "ex": [{"cn": "日本在1895年利用甲午战争窃取钓鱼岛是非法无效的。", "ru": "В 1895 году Япония, воспользовавшись японо-китайской войной, похитила острова Дяоюйдао; это действие незаконно и не имеет юридической силы."}, {"cn": "是对历史事实和国际法理的严重践踏。", "ru": "Это грубое попрание исторических фактов и принципов международного права."}, {"cn": "1879年，日本 const Q=[["Содержит ли приведенный фрагмент метафору? ","所给片段中是否包含隐喻？"],["Является ли эта метафора сильной?",""],["Является ли эта метафора персуазивной? ","该隐喻是否具有劝服性？"]];

let me={name:"",ans:{}},cur=null,rid="";

// сотрутся сохранённые в браузере ответы и выдастся новый id, поэтому старые данные не подтянутся.
const EPOCH="2026-11-16-reset1";
try{if(localStorage.getItem("epoch")!==EPOCH){localStorage.removeItem("rid");localStorage.removeItem("me");localStorage.setItem("epoch",EPOCH)}}catch(e){}
try{rid=localStorage.getItem("rid")||"";if(!rid){rid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));localStorage.setItem("rid",rid)}}catch(e){rid=rid||String(Date.now())+Math.random().toString(16).slice(2)}

function home(){cur=null;
 $("#app").innerHTML=`<h1>Опрос: метафоры в китайских белых книгах</h1>
 <p class="mut">15 документов. К каждому фрагменту один вопрос: метафора это или нет. Ответ «Да 是» или «Нет 否». Ответы сохраняются автоматически, можно закрыть страницу и продолжить позже.</p>

`;
}

 ${Q.slice(0,1).map((q,j)=>{const p=k*3+j,v=a[p];return `<div class="q">${esc(q[0])}<span class="cn">${esc(q[1])}</span></div><div class="ans" data-p="${p}"><button data-v="1" class="${v==="1"?"on1":""}">Да 是</button><button data-v="0" class="${v==="0"?"on0":""}">Нет 否</button></div>`}).join("")}</div>`).join("")}
 <button class="pri" id="back2">Готово, к списку</button>`;scrollTo(0,0)}
let timer,busy=false,dirty=false;const dd=new Set();
const st=t=>{const e=$("#st");if(e)e.textContent=t};
function queue(){dirty=true;st("Сохранение…");clearTimeout(timer);timer=setTimeout(flush,700)}
async function flush(){if(busy){timer=setTimeout(flush,400);return}if(!dirty)return;
 cache();if(!CONFIGURED){st("Не сохранено: опрос не подключён");return}
 busy=true;dirty=false;const ds=[...dd];
 try{for(const d of ds){dd.delete(d);try{const r=await api({action:"save",id:rid,name:me.name.trim(),doc:d,a:ansOf(d)});if(!r.ok)throw 0}catch(e){dd.add(d);throw e}}
  if(!ds.length&&me.name.trim()&&Object.keys(me.ans).length){const r=await api({action:"rename",id:rid,name:me.name.trim()});if(!r.ok)throw 0}

document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;

  if(t.dataset.v!==undefined&&cur!==null){const p=+t.parentNode.dataset.p,a=ansOf(cur).split("");a[p]=t.dataset.v;me.ans[cur]=a.join("");dd.add(cur);
  [...t.parentNode.children].forEach(b=>b.className=b===t?"on"+b.dataset.v:"");queue()}});
document.addEventListener("input",e=>{if(e.target.id==="nm"){me.name=e.target.value;e.target.style.boxShadow="";clearTimeout(timer);dirty=true;timer=setTimeout(flush,1200)}});
(async()=>{try{const c=JSON.parse(localStorage.getItem("me")||"null");if(c){me.name=c.name||"";me.ans=c.ans||{}}}catch(e){}
